# ---------------------------------------------------------------------------
# Productos vigilados. Precios en EUR, comparados con el COSTE PUESTO EN CASA
# (precio + IVA de importación + envío estimado, ver "landing" más abajo).
#  steal_price: por debajo = 🚨 GANGA (precio extremadamente bueno) → aviso urgente siempre
#  max_price:   por debajo = 🔥 buen precio (≈ lanzamiento)
#  min_price:   por debajo = ⚠️ sospechoso (accesorio, estafa, marketplace raro) → no avisa
#  require_all: cada grupo debe aparecer en el título (basta un término del grupo)
#  exclude:     si aparece cualquiera, se descarta (se suman las de common_exclude)
# Los títulos se comparan sin tildes ni mayúsculas ("Portátil" = "portatil").
# ---------------------------------------------------------------------------
products:
  - id: rtx5090
    name: GeForce RTX 5090 32 GB
    # Founders Edition: 2.369 € en España / 1.999 $ en EE. UU. (ene-2025). Ajusta a tu gusto.
    steal_price: 2000
    max_price: 2400
    min_price: 1300
    require_all:
      - ["5090"]
      - ["rtx", "geforce"]
    exclude: [
      # portátiles y PCs montados, en varios idiomas
      "laptop", "portatil", "portatile", "notebook", "pc portable", "kannettava", "barbar dator",
      "pc gaming", "gaming pc", "pc gamer", "pc da gaming", "pc fisso", "ordenador", "ordinateur",
      "sobremesa", "torre", "equipo", "workstation", "desktop", "komplett pc", "gaming rechner",
      "komputer", "pocitac", "herni pc", "speldator", "gamingdator", "unita centrale",
      # otras GPUs y accesorios
      "5090 d", "d v2", "rtx pro", "5080", "5070",
      "waterblock", "wasserkuhler", "bloque", "backplate", "cable", "kabel", "adaptador",
      "adapter", "soporte", "funda", "riser",
    ]
    queries: ["RTX 5090", "GeForce RTX 5090 32GB"]

  - id: gb10
    name: NVIDIA DGX Spark / GB10 (Dell Pro Max, ASUS GX10, Lenovo PGX, MSI, Acer, HP, Gigabyte)
    # DGX Spark FE: 3.999 $ (4 TB). Versiones de socios con 1-2 TB desde ~2.999 $.
    steal_price: 3000
    max_price: 3800
    min_price: 1800
    require_all:
      - ["dgx spark", "gb10", "gx10", "ascent gx10", "thinkstation pgx", "veriton gn100",
         "gn100", "edgexpert", "zgx nano", "ai top atom", "grace blackwell superchip"]
    exclude: [
      "cable", "kabel", "qsfp", "adaptador", "adapter", "soporte", "funda", "libro", "book",
      "curso", "gb200", "dgx station",
    ]
    queries: ["NVIDIA DGX Spark", "Dell Pro Max GB10", "ASUS Ascent GX10",
              "Lenovo ThinkStation PGX", "MSI EdgeXpert", "Acer Veriton GN100"]

# Se aplican a todos los productos: usado / reacondicionado / caja vacía / piezas / alquiler,
# en ES EN DE FR IT PT NL PL CZ SE DK NO FI HU RO. Muy útil en eBay, Walmart y Allegro.
common_exclude: [
  "segunda mano", "usado", "used", "gebraucht", "occasion", "usato", "gebruikt", "tweedehands",
  "uzywany", "pouzity", "pouzite", "begagnad", "brugt", "brukt", "kaytetty", "hasznalt",
  "second hand", "pre owned", "preowned",
  "reacondicionado", "refurbished", "renewed", "reconditionne", "ricondizionato", "recondicionado",
  "odnowiony", "generaluberholt", "resigilat", "rozbaleno", "open box", "b ware", "ex demo", "ex display",
  "box only", "only box", "empty box", "caja vacia", "solo caja", "leerkarton", "nur karton",
  "nur ovp", "boite vide", "scatola vuota", "pusty karton", "photo of", "picture of", "foto de",
  "for parts", "para piezas", "defekt", "defectuoso", "defective", "not working", "pour pieces",
  "per ricambi", "na czesci", "read description", "lea la descripcion",
  "alquiler", "rental", "miete", "mieten", "noleggio", "wynajem",
]

# Búsquedas que se lanzan en cada tienda (menos búsquedas = pasada más rápida).
# Quita esta línea para usar las "queries" de cada producto.
shop_queries: ["RTX 5090", "DGX Spark", "GB10", "Ascent GX10", "ThinkStation PGX"]

# Sólo avisar de gangas y de "últimas unidades" a buen precio (false) o también de cualquier
# buen precio (true).
notify_deals: true

# ---------------------------------------------------------------------------
# Coste puesto en casa para tiendas de otro país.
#  factor: multiplica el precio en EUR; extra_eur: envío/gestión estimados.
#  Dentro de la UE el precio ya lleva IVA. EE. UU. publica sin impuestos: +21 % IVA
#  de importación (las GPUs y miniPCs no pagan arancel en la UE) + envío/aduana.
# ---------------------------------------------------------------------------
home_region: ES
landing:
  default: {factor: 1.0,  extra_eur: 20}   # resto de la UE
  GB:      {factor: 1.01, extra_eur: 40}   # se quita el IVA UK 20 % y se paga el 21 % al importar
  CH:      {factor: 1.12, extra_eur: 40}   # IVA suizo 8,1 % → 21 %
  "NO":    {factor: 0.97, extra_eur: 40}   # IVA noruego 25 % → 21 %
  US:      {factor: 1.21, extra_eur: 80}   # sin sales tax + IVA importación + envío/DHL

# ---------------------------------------------------------------------------
# Fuentes. type:
#   serpapi → Google Shopping en varios países (cientos de tiendas). Necesita SERPAPI_KEY.
#   search  → buscador interno de una tienda o comparador; {query} se sustituye.
#   page    → URLs fijas (fichas de producto / tienda oficial).
# Opciones: region (país, para el coste en casa), currency (si la web no la indica),
#   render: true (Chromium/Playwright para webs con JavaScript o anti-bot),
#   queries (sustituye a shop_queries en esa fuente), every_minutes (no consultarla más
#   a menudo), enabled: false, selectors {item, title, price, link, stock}.
#   variants: la misma tienda en varios países; cada variante hereda todo y sobrescribe
#   lo que ponga (normalmente region, currency y url). Se llama "<name> <region>".
# Las URLs de búsqueda cambian con el tiempo: si una da 0 ofertas, revísala o desactívala.
# ---------------------------------------------------------------------------
sources:
  # ======================= GOOGLE SHOPPING (toda Europa + EE. UU.) ==========
  # Coste en búsquedas por pasada = nº países × nº queries (aquí 9 × 3 = 27).
  - name: Google Shopping
    type: serpapi
    countries: [es, de, fr, it, nl, at, pt, gb, us]
    queries: ["RTX 5090", "DGX Spark", "GB10"]
    every_minutes: 360

  # ======================= GRANDES MARKETPLACES =============================
  - name: Amazon
    type: search
    render: true
    selectors:
      item: 'div[data-component-type="s-search-result"]'
      title: "h2"
      price: "span.a-price span.a-offscreen"
      link: "a.a-link-normal"
      stock: "div.a-row.a-size-base"
    variants:
      - {region: ES, url: "https://www.amazon.es/s?k={query}"}
      - {region: DE, url: "https://www.amazon.de/s?k={query}"}
      - {region: FR, url: "https://www.amazon.fr/s?k={query}"}
      - {region: IT, url: "https://www.amazon.it/s?k={query}"}
      - {region: NL, url: "https://www.amazon.nl/s?k={query}"}
      - {region: BE, url: "https://www.amazon.com.be/s?k={query}"}
      - {region: PL, currency: PLN, url: "https://www.amazon.pl/s?k={query}"}
      - {region: SE, currency: SEK, url: "https://www.amazon.se/s?k={query}"}
      - {region: GB, currency: GBP, url: "https://www.amazon.co.uk/s?k={query}"}
      - {region: US, currency: USD, url: "https://www.amazon.com/s?k={query}"}

  # eBay: sólo artículos NUEVOS y "Cómpralo ya", ordenados por precio + envío.
  - name: eBay
    type: search
    selectors:
      item: "li.s-item, li.s-card"
      title: ".s-item__title, .s-card__title"
      price: ".s-item__price, .s-card__price"
      link: "a.s-item__link, a.su-link, a"
    variants:
      - {region: US, currency: USD, url: "https://www.ebay.com/sch/i.html?_nkw={query}&LH_ItemCondition=1000&LH_BIN=1&_sop=15"}
      - {region: ES, url: "https://www.ebay.es/sch/i.html?_nkw={query}&LH_ItemCondition=1000&LH_BIN=1&_sop=15"}
